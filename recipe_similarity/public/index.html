<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レシピ類似度検索</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🍳 レシピ類似度検索</h1>
      <p class="subtitle">材料を入力すると、世界の似た料理を探します</p>
    </header>

    <main>
      <form id="search-form">
        <div class="input-group">
          <label for="ingredients-input">材料をカンマ区切りで入力（英語 / 日本語可）</label>
          <input
            type="text"
            id="ingredients-input"
            placeholder="例: potato, onion, beef, soy sauce または じゃがいも, 玉ねぎ, 牛肉"
            autocomplete="off"
          />
          <p class="hint">例: 肉じゃがなら「potato, onion, beef, soy sauce, mirin」または「じゃがいも, 玉ねぎ, 牛肉, しょうゆ, みりん」</p>
        </div>

        <div class="tag-area" id="ingredient-tag-area"></div>

        <div class="input-group">
          <label for="methods-input">調理法をカンマ区切りで入力（英語 / 日本語可）</label>
          <input
            type="text"
            id="methods-input"
            placeholder="例: boil, stew, fry または 煮る, 炒める, 蒸す"
            autocomplete="off"
          />
          <p class="hint">例: 煮る / stew、炒める / fry、蒸す / steam</p>
        </div>

        <div class="tag-area" id="method-tag-area"></div>

        <button type="submit" id="search-btn" disabled>検索する</button>
      </form>
    </main>
  </div>

  <script src="js/search.js"></script>
</body>
</html>
